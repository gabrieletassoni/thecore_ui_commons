# PostgreSQL only: Postgres is the sole DB target of all Thecore gems and host apps.
# When DATABASE_URL is set (e.g. in the devcontainer), config/boot.rb rewrites its database
# name to thecore_ui_commons_<env>, so tests never touch the host app's databases.
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("PGHOST", "db") %>
  port: <%= ENV.fetch("PGPORT", 5432) %>
  username: <%= ENV.fetch("PGUSER", "postgres") %>
  password: <%= ENV.fetch("PGPASSWORD", "postgres") %>

development:
  <<: *default
  database: thecore_ui_commons_development

test:
  <<: *default
  database: thecore_ui_commons_test

production:
  <<: *default
  database: thecore_ui_commons_production
